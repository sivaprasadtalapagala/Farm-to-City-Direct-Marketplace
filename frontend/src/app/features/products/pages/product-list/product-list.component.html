<div class="product-container">

  <!-- Loader -->
  <div *ngIf="loading" class="loader">
    <mat-spinner></mat-spinner>
  </div>

  <!-- Product Grid -->
  <div *ngIf="!loading" class="product-grid">
    <mat-card
      class="product-card"
      *ngFor="let product of products; trackBy: trackById"
    >
      <img
        mat-card-image
        [src]="getImage(product)"
        [alt]="product.name"
      />

      <mat-card-content>
        <h3>{{ product.name }}</h3>
        <p class="price">
          ₹{{ product.pricePerKg }} / {{ product.unit }}
        </p>
      </mat-card-content>
    </mat-card>
  </div>

</div>
